<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>503 - Website Not Found or Under Maintenance</title>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Share Tech Mono', monospace;
      background: #0a0a0a;
      color: #ff2222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ── LEADERBOARD TOP ── */
    .leaderboard {
      width: 100%;
      height: 90px;
      background: #fff;
      border-bottom: 3px solid #ff2222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .leaderboard .ad-tag {
      position: absolute; top: 4px; left: 6px;
      font-size: 9px; color: #999; font-family: Arial, sans-serif;
      background: #f0f0f0; padding: 1px 5px; border-radius: 2px;
    }
    .leaderboard-inner {
      display: flex; align-items: center; gap: 20px;
      padding: 0 20px; width: 100%;
    }
    .leaderboard-img {
      width: 72px; height: 72px; object-fit: cover;
      border-radius: 6px; flex-shrink: 0;
    }
    .leaderboard-copy { flex: 1; }
    .leaderboard-copy .brand {
      font-size: 10px; color: #999; font-family: Arial, sans-serif;
      text-transform: uppercase; letter-spacing: 1px;
    }
    .leaderboard-copy .headline {
      font-size: 18px; font-weight: 700; color: #111;
      font-family: Arial, sans-serif; line-height: 1.2;
    }
    .leaderboard-copy .subline {
      font-size: 12px; color: #555; font-family: Arial, sans-serif;
    }
    .leaderboard-cta {
      background: #ff4500; color: #fff; border: none;
      padding: 10px 22px; font-size: 13px; font-weight: 700;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
      font-family: Arial, sans-serif; flex-shrink: 0;
    }
    .leaderboard-price {
      font-size: 22px; font-weight: 900; color: #ff4500;
      font-family: Arial, sans-serif; flex-shrink: 0;
    }

    /* ── LAYOUT ── */
    .main-layout { display: flex; flex: 1; }

    /* ── SKYSCRAPER SIDEBARS ── */
    .sidebar-left, .sidebar-right {
      width: 160px; min-width: 160px;
      background: #111;
      border-right: 1px solid #1a1a1a;
      display: flex; flex-direction: column;
      gap: 12px; padding: 12px 8px; align-items: center;
    }
    .sidebar-right { border-right: none; border-left: 1px solid #1a1a1a; }

    /* Real ad card in sidebar */
    .skyscraper-ad {
      width: 144px;
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
      font-family: Arial, sans-serif;
    }
    .skyscraper-ad .ad-tag {
      position: absolute; top: 4px; right: 4px;
      font-size: 8px; color: #999; background: rgba(255,255,255,0.85);
      padding: 1px 4px; border-radius: 2px; z-index: 2;
    }
    .skyscraper-ad img {
      width: 100%; height: 100px; object-fit: cover; display: block;
    }
    .skyscraper-ad .sky-body { padding: 8px; }
    .skyscraper-ad .sky-brand { font-size: 9px; color: #999; text-transform: uppercase; letter-spacing: 1px; }
    .skyscraper-ad .sky-title { font-size: 12px; font-weight: 700; color: #111; line-height: 1.3; margin: 3px 0; }
    .skyscraper-ad .sky-price { font-size: 16px; font-weight: 900; color: #e44; margin: 4px 0; }
    .skyscraper-ad .sky-old { font-size: 10px; color: #aaa; text-decoration: line-through; margin-left: 4px; }
    .skyscraper-ad .sky-cta {
      display: block; width: 100%; background: #111; color: #fff;
      border: none; padding: 7px; font-size: 11px; font-weight: 700;
      cursor: pointer; text-align: center; border-radius: 0 0 4px 4px;
      margin-top: 6px;
    }
    .skyscraper-ad .sky-badge {
      display: inline-block; background: #ff4500; color: #fff;
      font-size: 9px; font-weight: 700; padding: 2px 6px;
      border-radius: 3px; margin-bottom: 3px;
    }

    /* ── CENTER CONTENT ── */
    .center-content {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; padding: 28px 20px; gap: 20px;
    }

    /* Error block */
    .error-block { text-align: center; }
    .error-icon { font-size: 56px; animation: shake 0.9s infinite; display: block; }
    @keyframes shake {
      0%,100% { transform: rotate(-2deg); }
      25% { transform: rotate(2deg) scale(1.05); }
      75% { transform: rotate(-1deg) scale(0.97); }
    }
    .error-code {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 90px; color: #ff2222; letter-spacing: -3px;
      line-height: 1; text-shadow: 0 0 40px #ff000055;
      animation: flicker 4s infinite;
    }
    @keyframes flicker {
      0%,19%,21%,23%,25%,54%,56%,100% { opacity: 1; }
      20%,24%,55% { opacity: 0.35; }
    }
    .error-title {
      font-family: 'Black Han Sans', sans-serif;
      font-size: 22px; color: #ff3333; letter-spacing: 3px;
      text-transform: uppercase; line-height: 1.4;
    }
    .error-subtitle {
      font-size: 11px; color: #cc3333; line-height: 1.9;
      letter-spacing: 0.5px; opacity: 0.85; margin-top: 6px;
    }
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: #1a0000; border: 1px solid #ff2222;
      border-radius: 4px; padding: 6px 16px;
      font-size: 11px; color: #ff4444; letter-spacing: 1px;
    }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ff2222; animation: blink 1s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.15} }
    .progress-container { width: 100%; max-width: 320px; }
    .progress-label { font-size: 10px; color: #cc3333; margin-bottom: 4px; letter-spacing: 1px; }
    .progress-bar { height: 5px; background: #1a0000; border: 1px solid #550000; border-radius: 3px; overflow: hidden; }
    .progress-fill {
      height: 100%; background: #ff2222; border-radius: 2px; width: 0%;
      animation: prog 9s ease-in-out infinite;
    }
    @keyframes prog {
      0%{width:0%} 38%{width:71%} 39%{width:8%} 77%{width:88%} 78%{width:4%} 100%{width:0%}
    }

    /* ── RECTANGLE AD (300x250) ── */
    .rectangle-ad {
      width: 100%; max-width: 440px;
      background: #fff; border-radius: 8px;
      overflow: hidden; font-family: Arial, sans-serif;
      position: relative;
    }
    .rectangle-ad .ad-tag {
      position: absolute; top: 6px; left: 8px;
      font-size: 9px; color: #999; background: rgba(255,255,255,0.9);
      padding: 1px 5px; border-radius: 2px; z-index: 2;
    }
    .rectangle-ad img.rect-img {
      width: 100%; height: 160px; object-fit: cover; display: block;
    }
    .rect-body { padding: 12px 14px; }
    .rect-brand { font-size: 10px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .rect-headline { font-size: 20px; font-weight: 900; color: #111; line-height: 1.2; margin: 4px 0 2px; }
    .rect-desc { font-size: 12px; color: #666; line-height: 1.5; margin-bottom: 10px; }
    .rect-footer { display: flex; align-items: center; justify-content: space-between; }
    .rect-price-block .rect-price { font-size: 28px; font-weight: 900; color: #e44; }
    .rect-price-block .rect-was { font-size: 11px; color: #aaa; text-decoration: line-through; }
    .rect-cta {
      background: #111; color: #fff; border: none;
      padding: 12px 24px; font-size: 14px; font-weight: 700;
      border-radius: 5px; cursor: pointer;
    }
    .rect-badge {
      display: inline-block; background: #ff4500; color: #fff;
      font-size: 10px; font-weight: 700; padding: 3px 8px;
      border-radius: 3px; margin-bottom: 6px;
    }

    /* ── NATIVE / IN-FEED AD ── */
    .native-ad {
      width: 100%; max-width: 440px;
      background: #fff; border-radius: 8px;
      padding: 12px; font-family: Arial, sans-serif;
      display: flex; gap: 12px; align-items: flex-start;
      position: relative;
    }
    .native-ad .ad-tag {
      position: absolute; bottom: 8px; right: 10px;
      font-size: 9px; color: #bbb;
    }
    .native-ad img {
      width: 90px; height: 90px; object-fit: cover;
      border-radius: 6px; flex-shrink: 0;
    }
    .native-body { flex: 1; }
    .native-body .native-brand { font-size: 10px; color: #ff4500; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; }
    .native-body .native-title { font-size: 15px; font-weight: 700; color: #111; line-height: 1.3; margin: 3px 0 5px; }
    .native-body .native-desc { font-size: 11px; color: #777; line-height: 1.5; margin-bottom: 8px; }
    .native-body .native-cta {
      display: inline-block; background: #ff4500; color: #fff;
      font-size: 11px; font-weight: 700; padding: 6px 14px;
      border-radius: 4px; border: none; cursor: pointer;
    }
    .native-price { font-size: 16px; font-weight: 900; color: #e44; margin-top: 4px; display: block; }

    /* ── PRODUCT STRIP (carousel style) ── */
    .product-strip {
      width: 100%; max-width: 440px;
      background: #fff; border-radius: 8px;
      overflow: hidden; font-family: Arial, sans-serif;
      position: relative;
    }
    .product-strip .ad-tag {
      position: absolute; top: 6px; right: 8px;
      font-size: 9px; color: #999; background: rgba(255,255,255,0.9);
      padding: 1px 5px; border-radius: 2px; z-index: 2;
    }
    .strip-header {
      padding: 10px 12px 6px;
      font-size: 11px; color: #888; border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; justify-content: space-between;
    }
    .strip-header strong { color: #111; font-size: 13px; }
    .strip-cards { display: flex; gap: 0; }
    .strip-card {
      flex: 1; padding: 10px 8px; text-align: center;
      border-right: 1px solid #f5f5f5;
    }
    .strip-card:last-child { border-right: none; }
    .strip-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 4px; display: block; margin-bottom: 6px; }
    .strip-card .sc-title { font-size: 10px; font-weight: 700; color: #222; line-height: 1.3; margin-bottom: 3px; }
    .strip-card .sc-price { font-size: 13px; font-weight: 900; color: #e44; }
    .strip-card .sc-was { font-size: 9px; color: #bbb; text-decoration: line-through; }
    .strip-card .sc-btn {
      display: block; margin-top: 6px; background: #f5f5f5;
      border: none; padding: 4px 0; font-size: 10px; font-weight: 700;
      color: #333; border-radius: 3px; cursor: pointer; width: 100%;
    }

    /* ── BOTTOM LEADERBOARD ── */
    .bottom-leaderboard {
      background: #fff;
      border-top: 3px solid #ff2222;
      padding: 10px 20px;
      display: flex; align-items: center; gap: 16px;
      font-family: Arial, sans-serif;
      position: relative;
    }
    .bottom-leaderboard .ad-tag {
      position: absolute; top: 4px; right: 8px;
      font-size: 9px; color: #bbb;
    }
    .bottom-leaderboard img {
      width: 60px; height: 60px; object-fit: cover;
      border-radius: 5px; flex-shrink: 0;
    }
    .bl-copy { flex: 1; }
    .bl-copy .bl-brand { font-size: 9px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .bl-copy .bl-title { font-size: 16px; font-weight: 900; color: #111; }
    .bl-copy .bl-sub { font-size: 11px; color: #888; }
    .bl-right { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
    .bl-price { font-size: 24px; font-weight: 900; color: #e44; }
    .bl-cta {
      background: #ff4500; color: #fff; border: none;
      padding: 10px 20px; font-size: 13px; font-weight: 700;
      border-radius: 4px; cursor: pointer; white-space: nowrap;
    }

    /* floating pop-up ad */
    .popup-ad {
      position: fixed; bottom: 80px; right: 16px;
      width: 220px; background: #fff; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      font-family: Arial, sans-serif; overflow: hidden;
      z-index: 999; animation: popIn 0.4s ease;
    }
    @keyframes popIn { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
    .popup-ad .popup-close {
      position: absolute; top: 6px; right: 8px;
      font-size: 14px; color: #999; cursor: pointer;
      background: none; border: none; line-height: 1;
    }
    .popup-ad img { width: 100%; height: 110px; object-fit: cover; display: block; }
    .popup-body { padding: 10px 12px 12px; }
    .popup-body .p-brand { font-size: 9px; color: #ff4500; text-transform: uppercase; font-weight: 700; }
    .popup-body .p-title { font-size: 13px; font-weight: 700; color: #111; line-height: 1.3; margin: 3px 0 6px; }
    .popup-body .p-price { font-size: 18px; font-weight: 900; color: #e44; margin-bottom: 8px; }
    .popup-body .p-cta {
      display: block; width: 100%; background: #ff4500; color: #fff;
      border: none; padding: 8px; font-size: 12px; font-weight: 700;
      border-radius: 4px; cursor: pointer; text-align: center;
    }
    .popup-body .p-adlabel { font-size: 8px; color: #ccc; text-align: right; margin-top: 4px; }

    /* skeleton loader */
    .skel { background: linear-gradient(90deg,#eee 25%,#ddd 50%,#eee 75%); background-size: 200% 100%; animation: skel 1.2s infinite; border-radius: 4px; }
    @keyframes skel { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

  <!-- POPUP AD -->
  <div class="popup-ad" id="popup-ad">
    <button class="popup-close" onclick="this.parentElement.remove()">✕</button>
    <div class="skel" style="width:100%;height:110px;" id="popup-img-skel"></div>
    <div class="popup-body">
      <div class="p-brand skel" style="width:60px;height:10px;margin-bottom:4px;" id="popup-brand-skel"></div>
      <div class="p-title skel" style="width:90%;height:28px;margin-bottom:6px;" id="popup-title-skel"></div>
      <div class="p-price skel" style="width:50px;height:20px;margin-bottom:8px;" id="popup-price-skel"></div>
      <div class="p-cta skel" style="height:32px;" id="popup-cta-skel"></div>
    </div>
  </div>

  <!-- TOP LEADERBOARD -->
  <div class="leaderboard">
    <span class="ad-tag">Ad</span>
    <div class="leaderboard-inner" id="leaderboard-inner">
      <div class="skel" style="width:72px;height:72px;border-radius:6px;flex-shrink:0;"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
        <div class="skel" style="width:80px;height:10px;"></div>
        <div class="skel" style="width:200px;height:20px;"></div>
        <div class="skel" style="width:140px;height:12px;"></div>
      </div>
      <div class="skel" style="width:60px;height:36px;border-radius:4px;flex-shrink:0;"></div>
      <div class="skel" style="width:80px;height:28px;border-radius:4px;flex-shrink:0;"></div>
    </div>
  </div>

  <div class="main-layout">

    <!-- SIDEBAR LEFT -->
    <div class="sidebar-left" id="sidebar-left">
      <div class="skel" style="width:144px;height:220px;border-radius:6px;"></div>
      <div class="skel" style="width:144px;height:220px;border-radius:6px;"></div>
    </div>

    <!-- CENTER -->
    <div class="center-content">

      <div class="error-block">
        <span class="error-icon">🚫</span>
        <div class="error-code">503</div>
        <div class="error-title">Website Not Found<br>or Under Maintenance</div>
        <div class="error-subtitle">
          This website is currently unavailable.<br>
          We are working hard to restore service.<br>
          Please try again later.
        </div>
      </div>

      <div class="status-bar">
        <div class="status-dot"></div>
        <span>MAINTENANCE IN PROGRESS...</span>
      </div>

      <div class="progress-container">
        <div class="progress-label">REPAIR PROGRESS</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>

      <!-- RECTANGLE AD -->
      <div class="rectangle-ad" id="rect-ad">
        <span class="ad-tag">Sponsored</span>
        <div class="skel rect-img" style="height:160px;"></div>
        <div class="rect-body">
          <div class="skel" style="width:60px;height:10px;margin-bottom:6px;"></div>
          <div class="skel" style="width:90%;height:22px;margin-bottom:6px;"></div>
          <div class="skel" style="width:100%;height:30px;margin-bottom:10px;"></div>
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div class="skel" style="width:70px;height:32px;border-radius:4px;"></div>
            <div class="skel" style="width:100px;height:40px;border-radius:5px;"></div>
          </div>
        </div>
      </div>

      <!-- NATIVE IN-FEED AD -->
      <div class="native-ad" id="native-ad">
        <div class="skel" style="width:90px;height:90px;border-radius:6px;flex-shrink:0;"></div>
        <div style="flex:1;display:flex;flex-direction:column;gap:6px;">
          <div class="skel" style="width:70px;height:10px;"></div>
          <div class="skel" style="width:90%;height:16px;"></div>
          <div class="skel" style="width:100%;height:28px;"></div>
          <div class="skel" style="width:80px;height:28px;border-radius:4px;"></div>
        </div>
      </div>

      <!-- PRODUCT STRIP -->
      <div class="product-strip" id="product-strip">
        <span class="ad-tag">Sponsored</span>
        <div class="strip-header">
          <strong id="strip-title">Products you might like</strong>
          <span style="font-size:10px;color:#aaa;">Ad</span>
        </div>
        <div class="strip-cards" id="strip-cards">
          <div class="strip-card"><div class="skel" style="height:80px;border-radius:4px;margin-bottom:6px;"></div><div class="skel" style="height:12px;margin-bottom:4px;"></div><div class="skel" style="width:50px;height:14px;margin:0 auto;"></div></div>
          <div class="strip-card"><div class="skel" style="height:80px;border-radius:4px;margin-bottom:6px;"></div><div class="skel" style="height:12px;margin-bottom:4px;"></div><div class="skel" style="width:50px;height:14px;margin:0 auto;"></div></div>
          <div class="strip-card"><div class="skel" style="height:80px;border-radius:4px;margin-bottom:6px;"></div><div class="skel" style="height:12px;margin-bottom:4px;"></div><div class="skel" style="width:50px;height:14px;margin:0 auto;"></div></div>
          <div class="strip-card"><div class="skel" style="height:80px;border-radius:4px;margin-bottom:6px;"></div><div class="skel" style="height:12px;margin-bottom:4px;"></div><div class="skel" style="width:50px;height:14px;margin:0 auto;"></div></div>
        </div>
      </div>

    </div>

    <!-- SIDEBAR RIGHT -->
    <div class="sidebar-right" id="sidebar-right">
      <div class="skel" style="width:144px;height:220px;border-radius:6px;"></div>
      <div class="skel" style="width:144px;height:220px;border-radius:6px;"></div>
    </div>

  </div>

  <!-- BOTTOM LEADERBOARD -->
  <div class="bottom-leaderboard" id="bottom-leaderboard">
    <span class="ad-tag">Sponsored</span>
    <div class="skel" style="width:60px;height:60px;border-radius:5px;flex-shrink:0;"></div>
    <div style="flex:1;display:flex;flex-direction:column;gap:5px;">
      <div class="skel" style="width:60px;height:9px;"></div>
      <div class="skel" style="width:180px;height:18px;"></div>
      <div class="skel" style="width:120px;height:12px;"></div>
    </div>
    <div style="display:flex;align-items:center;gap:14px;">
      <div class="skel" style="width:60px;height:28px;border-radius:3px;"></div>
      <div class="skel" style="width:110px;height:38px;border-radius:4px;"></div>
    </div>
  </div>

  <script>
    const slogans = ["Limited offer!","Only a few left!","Best seller","Flash deal","Hot pick","Top rated","Editor's choice","Trending now"];
    const ctaLabels = ["Shop Now","Buy Now","Get Deal","Grab It","See Offer","Order Now"];
    const discountLabels = ["SALE","HOT","NEW","DEAL","TOP"];

    function t(str, n) { return str && str.length > n ? str.slice(0, n) + '…' : (str || ''); }
    function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
    function thumb(p) { return p.thumbnail || (Array.isArray(p.images) && p.images[0]) || ''; }
    function oldPrice(price, disc) { return disc ? (price / (1 - disc / 100)).toFixed(2) : null; }
    function discPct(p) { return p.discountPercentage ? Math.round(p.discountPercentage) + '% OFF' : rnd(discountLabels); }

    async function fetchProducts() {
      const skip = Math.floor(Math.random() * 60);
      const r = await fetch(`https://dummyjson.com/products?limit=20&skip=${skip}`);
      const d = await r.json();
      return d.products || [];
    }

    function renderLeaderboard(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      document.getElementById('leaderboard-inner').innerHTML = `
        <img src="${thumb(p)}" class="leaderboard-img" onerror="this.style.display='none'" />
        <div class="leaderboard-copy">
          <div class="brand">${p.brand || p.category}</div>
          <div class="headline">${t(p.title, 40)}</div>
          <div class="subline">${rnd(slogans)} · ${p.category}</div>
        </div>
        <div class="leaderboard-price">$${p.price}${was ? `<span style="font-size:13px;color:#aaa;text-decoration:line-through;margin-left:6px;">$${was}</span>` : ''}</div>
        <button class="leaderboard-cta">${rnd(ctaLabels)} →</button>
      `;
    }

    function renderSkyscraperAd(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      return `<div class="skyscraper-ad">
        <span class="ad-tag">Ad</span>
        <img src="${thumb(p)}" onerror="this.style.display='none'" />
        <div class="sky-body">
          <div class="sky-brand">${p.brand || p.category}</div>
          <span class="sky-badge">${discPct(p)}</span>
          <div class="sky-title">${t(p.title, 30)}</div>
          <div>
            <span class="sky-price">$${p.price}</span>
            ${was ? `<span class="sky-old">$${was}</span>` : ''}
          </div>
          <div style="font-size:9px;color:#aaa;margin-top:2px;">${rnd(slogans)}</div>
        </div>
        <button class="sky-cta">${rnd(ctaLabels)} →</button>
      </div>`;
    }

    function renderRectAd(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      document.getElementById('rect-ad').innerHTML = `
        <span class="ad-tag">Sponsored</span>
        <img src="${thumb(p)}" class="rect-img" onerror="this.style.display='none'" />
        <div class="rect-body">
          <div class="rect-brand">${p.brand || p.category}</div>
          <span class="rect-badge">${discPct(p)}</span>
          <div class="rect-headline">${t(p.title, 38)}</div>
          <div class="rect-desc">${t(p.description, 90)}</div>
          <div class="rect-footer">
            <div class="rect-price-block">
              <div class="rect-price">$${p.price}</div>
              ${was ? `<div class="rect-was">Was $${was}</div>` : ''}
            </div>
            <button class="rect-cta">${rnd(ctaLabels)} →</button>
          </div>
        </div>
      `;
    }

    function renderNativeAd(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      document.getElementById('native-ad').innerHTML = `
        <img src="${thumb(p)}" onerror="this.style.display='none'" />
        <div class="native-body">
          <div class="native-brand">${p.brand || p.category}</div>
          <div class="native-title">${t(p.title, 44)}</div>
          <div class="native-desc">${t(p.description, 80)}</div>
          <span class="native-price">$${p.price}${was ? ` <span style="font-size:11px;color:#bbb;text-decoration:line-through;">$${was}</span>` : ''}</span>
          <button class="native-cta" style="margin-top:8px;">${rnd(ctaLabels)} →</button>
        </div>
        <span class="ad-tag">Sponsored</span>
      `;
    }

    function renderProductStrip(products) {
      document.getElementById('strip-title').textContent = `Deals in ${products[0]?.category || 'products'}`;
      document.getElementById('strip-cards').innerHTML = products.map(p => {
        const was = oldPrice(p.price, p.discountPercentage);
        return `<div class="strip-card">
          <img src="${thumb(p)}" onerror="this.style.display='none'" />
          <div class="sc-title">${t(p.title, 20)}</div>
          <div class="sc-price">$${p.price}</div>
          ${was ? `<div class="sc-was">$${was}</div>` : ''}
          <button class="sc-btn">${rnd(ctaLabels)}</button>
        </div>`;
      }).join('');
    }

    function renderBottomLeaderboard(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      document.getElementById('bottom-leaderboard').innerHTML = `
        <span class="ad-tag">Sponsored</span>
        <img src="${thumb(p)}" onerror="this.style.display='none'" />
        <div class="bl-copy">
          <div class="bl-brand">${p.brand || p.category}</div>
          <div class="bl-title">${t(p.title, 42)}</div>
          <div class="bl-sub">${rnd(slogans)} · Free shipping available</div>
        </div>
        <div class="bl-right">
          <div class="bl-price">$${p.price}${was ? `<div style="font-size:11px;color:#bbb;text-decoration:line-through;font-weight:400;">$${was}</div>` : ''}</div>
          <button class="bl-cta">${rnd(ctaLabels)} →</button>
        </div>
      `;
    }

    function renderPopup(p) {
      const was = oldPrice(p.price, p.discountPercentage);
      document.getElementById('popup-ad').innerHTML = `
        <button class="popup-close" onclick="this.parentElement.remove()">✕</button>
        <img src="${thumb(p)}" onerror="this.style.display='none'" />
        <div class="popup-body">
          <div class="p-brand">${p.brand || p.category}</div>
          <div class="p-title">${t(p.title, 40)}</div>
          <div class="p-price">$${p.price}${was ? ` <span style="font-size:11px;color:#bbb;text-decoration:line-through;">$${was}</span>` : ''}</div>
          <button class="p-cta">${rnd(ctaLabels)} →</button>
          <div class="p-adlabel">Sponsored · Close ✕</div>
        </div>
      `;
    }

    async function init() {
      try {
        const products = await fetchProducts();
        if (!products.length) return;

        renderLeaderboard(products[0]);
        document.getElementById('sidebar-left').innerHTML =
          renderSkyscraperAd(products[1] || products[0]) +
          renderSkyscraperAd(products[2] || products[0]);
        document.getElementById('sidebar-right').innerHTML =
          renderSkyscraperAd(products[3] || products[0]) +
          renderSkyscraperAd(products[4] || products[0]);
        renderRectAd(products[5] || products[0]);
        renderNativeAd(products[6] || products[0]);
        renderProductStrip(products.slice(7, 11));
        renderBottomLeaderboard(products[11] || products[0]);
        renderPopup(products[12] || products[0]);
      } catch(e) { console.error(e); }
    }

    init();
  </script>
</body>
</html>
